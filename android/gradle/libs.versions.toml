kape-amnezia-wireguard = { module = "com.kape.amneziawg:wireguard-tunnel", version.ref = "kapeAmneziaWireguard" }
kape-openvpn = { module = "com.github.pia-foss.mobile-android-vpn-manager:openvpn", version.ref = "kapeOpenVpn" }
kape-lightway = { module = "com.kape:lightway", version.ref = "kapeLightway" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }

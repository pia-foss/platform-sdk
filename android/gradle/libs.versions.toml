[versions]
# SDK
kotlin = "2.3.21"
agp = "9.2.1"
coreKtx = "1.18.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
kapeClientSdk = "22.4.0"
ktlint = "14.2.0"
datastore = "1.2.1"
coroutines = "1.11.0"
appauth = "0.11.1"
kapeAmneziaWireguard = "0.3.2"
kapeOpenVpn = "0.4.15"
kapeLightway = "26.07.20-1"
mockk = "1.14.2"
ktor = "3.5.0"
clikt = "5.0.2"
kotlinxSerializationJson = "1.10.0"
slf4j = "2.0.18"
minidns = "1.1.1"

# Example apps
lifecycleRuntimeKtx = "2.10.0"
lifecycleViewModel = "2.11.0-beta01"
navigation3 = "1.1.2"
activityCompose = "1.13.0"
composeBom = "2026.05.01"

[libraries]
kape-client-sdk = { module = "com.kape:client-sdk-async", version.ref = "kapeClientSdk" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycleViewModel" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewModel" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
